<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Attendance Tracker</title>
  
<section id="attendance" class="form">
    <h2>Attendance Tracker</h2>
  
    <select id="input1" class="form-select mb-2">
        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
    </select>

    <input type="number" id="input2" class="form-control mb-2" placeholder="Absences">

    <button class="btn btn-success w-100" py-click="displaying_output">
        Submit
    </button>

    <div id="output2" class="mt-3"></div>
</section>
